name: Atualizar Tag Google Analytics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ga-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Substituir ID do Google Analytics
        run: |
          find . -name "*.html" -not -path "./.git/*" | xargs sed -i 's/G-JDV0ZGBPV9/G-6DSL2EMZSL/g'
          echo "Arquivos alterados:"
          grep -rl "G-6DSL2EMZSL" . --include="*.html" | head -60

      - name: Commit e Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Atualiza Google Analytics: G-JDV0ZGBPV9 -> G-6DSL2EMZSL"
          git push
