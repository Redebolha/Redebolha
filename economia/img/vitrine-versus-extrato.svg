<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="Grafico comparativo: de um lado, um carro de 150 mil reais e 10 mil reais investidos, somando 160 mil reais de patrimonio; do outro, um carro de 30 mil reais e 500 mil reais investidos, somando 530 mil reais. O segundo parece menos rico na rua e tem 3,3 vezes mais patrimonio.">
<defs>
  <linearGradient id="fundo2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#141A24"/><stop offset="1" stop-color="#0B0E14"/>
  </linearGradient>
  <style>
    .chapeu{font:600 22px Arial,Helvetica,sans-serif;letter-spacing:6px;fill:#E0A437}
    .titulo{font:700 54px Georgia,'Times New Roman',serif;fill:#F5F1E8}
    .sub{font:400 25px Arial,Helvetica,sans-serif;fill:#8B93A1}
    .cab{font:700 21px Arial,Helvetica,sans-serif;letter-spacing:4px}
    .lab{font:400 22px Arial,Helvetica,sans-serif;fill:#8B93A1}
    .val{font:700 24px Arial,Helvetica,sans-serif;fill:#F5F1E8}
    .totlab{font:400 20px Arial,Helvetica,sans-serif;fill:#8B93A1}
    .tot{font:700 44px Georgia,'Times New Roman',serif;fill:#F5F1E8}
    .totouro{font:700 44px Georgia,'Times New Roman',serif;fill:#E8D48B}
    .fecho{font:400 26px Georgia,'Times New Roman',serif;fill:#E8D48B}
    .marca{font:700 20px Arial,Helvetica,sans-serif;fill:#E0A437;letter-spacing:3px}
    .fonte{font:400 18px Arial,Helvetica,sans-serif;fill:#6E7684}
  </style>
</defs>

<rect width="1600" height="900" fill="url(#fundo2)"/>
<rect x="0" y="0" width="10" height="900" fill="#E0A437"/>

<text class="chapeu" x="70" y="92">PATRIM&#212;NIO &#215; APAR&#202;NCIA</text>
<text class="titulo" x="70" y="164">Quem parece mais rico e quem &#233; mais rico</text>
<text class="sub" x="70" y="212">As mesmas duas vidas, vistas da cal&#231;ada e vistas do extrato</text>

<!-- CARD ESQUERDA -->
<rect x="100" y="280" width="660" height="480" rx="16" fill="#171D28" stroke="#2A3140"/>
<text class="cab" x="140" y="336" fill="#8B93A1">PARECE MAIS RICO</text>
<line x1="140" y1="356" x2="720" y2="356" stroke="#2A3140" stroke-width="2"/>

<text class="lab" x="140" y="410">Carro na garagem</text>
<text class="val" x="720" y="410" text-anchor="end">R$ 150 mil</text>
<rect x="140" y="426" width="168" height="22" rx="5" fill="#3A4250"/>

<text class="lab" x="140" y="502">Dinheiro investido</text>
<text class="val" x="720" y="502" text-anchor="end">R$ 10 mil</text>
<rect x="140" y="518" width="11" height="22" rx="5" fill="#E0A437"/>

<line x1="140" y1="596" x2="720" y2="596" stroke="#2A3140" stroke-width="2"/>
<text class="totlab" x="140" y="644">Patrim&#244;nio somado</text>
<text class="tot" x="140" y="706">R$ 160 mil</text>

<!-- CARD DIREITA -->
<rect x="840" y="280" width="660" height="480" rx="16" fill="#171D28" stroke="#E0A437"/>
<text class="cab" x="880" y="336" fill="#E0A437">&#201; MAIS RICO</text>
<line x1="880" y1="356" x2="1460" y2="356" stroke="#2A3140" stroke-width="2"/>

<text class="lab" x="880" y="410">Carro na garagem</text>
<text class="val" x="1460" y="410" text-anchor="end">R$ 30 mil</text>
<rect x="880" y="426" width="34" height="22" rx="5" fill="#3A4250"/>

<text class="lab" x="880" y="502">Dinheiro investido</text>
<text class="val" x="1460" y="502" text-anchor="end">R$ 500 mil</text>
<rect x="880" y="518" width="560" height="22" rx="5" fill="#E0A437"/>

<line x1="880" y1="596" x2="1460" y2="596" stroke="#2A3140" stroke-width="2"/>
<text class="totlab" x="880" y="644">Patrim&#244;nio somado</text>
<text class="totouro" x="880" y="706">R$ 530 mil</text>

<text class="fecho" x="800" y="812" text-anchor="middle">Na cal&#231;ada, o da esquerda ganha. No extrato, o da direita tem 3,3 vezes mais &#8212;</text>
<text class="fecho" x="800" y="848" text-anchor="middle">e meio milh&#227;o trabalhando enquanto ele dorme.</text>

<text class="marca" x="100" y="884">REDE BOLHA</text>
<text class="fonte" x="1500" y="884" text-anchor="end">Exemplo ilustrativo, com valores hipot&#233;ticos.</text>
</svg>
